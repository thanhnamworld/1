
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chung đường - Xe Tiện Chuyến Thông Minh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
          font-family: 'Inter', sans-serif;
          background-color: #f8fafc;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          letter-spacing: -0.01em;
        }
        h1, h2, h3, h4, .font-outfit {
          font-family: 'Outfit', sans-serif;
        }
        .glass {
          background: rgba(255, 255, 255, 0.7);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
          width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #e2e8f0;
          border-radius: 10px;
        }
        
        /* --- ROAD ANIMATION V3: U-TURN & DYNAMIC COLOR --- */
        @keyframes carDriveV3 {
          0% { left: -10%; transform: translateY(-50%) scaleX(1); }
          42% { left: 105%; transform: translateY(-50%) scaleX(1); }
          46% { left: 105%; transform: translateY(-50%) scaleX(-1) rotate(-8deg); } /* Quay đầu phải */
          50% { left: 105%; transform: translateY(-50%) scaleX(-1); }
          92% { left: -5%; transform: translateY(-50%) scaleX(-1); }
          96% { left: -5%; transform: translateY(-50%) scaleX(1) rotate(8deg); } /* Quay đầu trái */
          100% { left: -10%; transform: translateY(-50%) scaleX(1); }
        }

        @keyframes carVibrationV3 {
          0%, 100% { margin-top: 0px; }
          50% { margin-top: -1.5px; }
        }

        @keyframes carColorCycleV3 {
          0%, 100% { background-color: #10b981; color: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); } /* T2 */
          14% { background-color: #3b82f6; color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); } /* T3 */
          28% { background-color: #6366f1; color: #6366f1; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); } /* T4 */
          42% { background-color: #a855f7; color: #a855f7; box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4); } /* T5 */
          56% { background-color: #ec4899; color: #ec4899; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4); } /* T6 */
          70% { background-color: #f43f5e; color: #f43f5e; box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4); } /* T7 */
          84% { background-color: #f59e0b; color: #f59e0b; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); } /* CN */
        }

        @keyframes roadFlowV3 {
          0% { background-position: 0 0; }
          42% { background-position: -120px 0; }
          50% { background-position: -120px 0; }
          92% { background-position: 120px 0; }
          100% { background-position: 0 0; }
        }

        .road-container {
          position: relative;
          height: 38px;
          display: flex;
          align-items: center;
          background: #f1f5f9;
          border-radius: 19px;
          padding: 0 16px;
          overflow: hidden;
          border: 1px solid #e2e8f0;
        }

        .road-line-v3 {
          position: absolute;
          left: 0;
          right: 0;
          height: 1.5px;
          background-image: linear-gradient(to right, #cbd5e1 40%, transparent 40%);
          background-size: 20px 100%;
          opacity: 0.4;
          animation: roadFlowV3 12s linear infinite;
        }

        .animated-car-v3 {
          position: absolute;
          animation: carDriveV3 12s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
          top: 50%;
          z-index: 10;
          display: flex;
          align-items: center;
        }

        .car-body-v3 {
          padding: 6px;
          border-radius: 10px;
          color: white !important;
          animation: carColorCycleV3 12s linear infinite, carVibrationV3 0.25s ease-in-out infinite;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1.5px solid rgba(255, 255, 255, 0.4);
        }

        .day-dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          background: #e2e8f0;
        }
        
        .day-label {
          font-size: 7px;
          font-weight: 900;
          color: #94a3b8;
          text-transform: uppercase;
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",

      }
    }

    </script>
</head>

</html>
